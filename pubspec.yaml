name: dataset_training_tool
description: "Desktop toolkit for building and captioning Stable Diffusion training datasets."
publish_to: 'none'
version: 1.17.1+19

environment:
  sdk: '>=3.9.0 <4.0.0'
  # Exact version on purpose: CI and release.yml install this via
  # subosito/flutter-action's flutter-version-file, and `flutter pub get`
  # refuses a mismatched local SDK, so all three toolchains stay identical.
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.2.2
  image: ^4.10.1
  markdown_widget: ^2.3.2
  archive: ^4.3.0
  desktop_multi_window: ^0.3.1
  file_saver: ^0.6.0
  reorderable_grid_view: ^2.2.8
  pinyin: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Windows installer packaging (`dart run msix:create`); build-time only.
  msix: ^3.18.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/icon.png
    # WD tagger label file (SmilingWolf/wd-swinv2-tagger-v3, selected_tags.csv)
    # — the offline tag dictionary behind caption autocomplete.
    - assets/tags/wd_tags.csv

msix_config:
  display_name: Dataset Toolkit
  publisher_display_name: joycai
  publisher: CN=joycai
  identity_name: com.joycai.datasettrainingtool
  msix_version: 1.17.1.19
  logo_path: assets/icon/icon.png
  capabilities: internetClient
