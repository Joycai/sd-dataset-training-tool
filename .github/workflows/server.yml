# Lightweight backend checks. Contract tests use Pillow and stub inference;
# model weights and GPU dependencies are not installed.
name: Server

on:
  push:
    branches: [ "main" ]
    paths:
      - 'AiApiServer/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'AiApiServer/**'
      - '.github/workflows/server.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Byte-compile all sources
        run: python -m compileall -q AiApiServer

      # Rule set lives in AiApiServer/ruff.toml.
      - name: Lint
        run: pipx run ruff check AiApiServer

      - name: Image processing contract tests
        run: |
          python -m pip install Pillow==11.3.0
          python -m unittest discover -s AiApiServer/tests -p 'test_*.py'
