# Pull-request / main gate: localization drift, formatting, analysis, layer
# rules and the test suite.
name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**.md'
      - 'AiApiServer/**'
      - '.claude/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'wiki/**'
      - '**.md'
      - 'AiApiServer/**'
      - '.claude/**'

permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # This is a Flutter app (flutter/flutter_localizations SDK deps), so it
      # needs the Flutter toolchain rather than a bare Dart SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `git status` rather than `git diff` so a brand-new generated file
      # (e.g. a locale added to the .arb set) fails the check too.
      - name: Verify localizations are up to date
        run: |
          flutter gen-l10n
          if [ -n "$(git status --porcelain lib/l10n)" ]; then
            echo "::error::lib/l10n is out of date — run 'flutter gen-l10n' and commit the result"
            git status --porcelain lib/l10n
            git --no-pager diff lib/l10n
            exit 1
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze project source
        run: flutter analyze

      - name: Check layer dependencies
        run: dart run tool/check_layers.dart

      # `flutter test` already picks the GitHub reporter under GITHUB_ACTIONS.
      - name: Run tests
        run: flutter test
