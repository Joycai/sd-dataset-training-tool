# Static analysis configuration. Run `flutter analyze` locally; CI runs the
# same command and fails on any issue. See https://dart.dev/lints for rules.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # gen-l10n output, regenerated from the .arb files.
    - lib/l10n/app_localizations*.dart
    - build/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Style — the codebase already follows these; keep it that way.
    - always_declare_return_types
    - directives_ordering
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - type_annotate_public_apis
    - use_super_parameters

    # Async correctness — a dropped Future swallows its error.
    - avoid_void_async
    - unawaited_futures

    # Resource hygiene.
    - cancel_subscriptions
    - close_sinks
